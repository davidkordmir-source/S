name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main, atlas-scout-preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: atlas-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Restore verified offline build inputs
        id: offline-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .model-cache
            .raster-cache
            .assistant-cache
          key: atlas-offline-inputs-${{ hashFiles('src/atlas/config.py', 'scripts/bundle-models.py', 'scripts/bundle-enhanced-models.py', 'scripts/bundle-neural-search.py', 'scripts/bundle-assistant-runtime.py', 'requirements-lock.txt') }}
          restore-keys: atlas-offline-inputs-
      - name: Prepare the pinned Rust toolchain for the vendored MIT decoder
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install, test, and package
        shell: pwsh
        run: |
          Start-Transcript -Path build.log
          try { ./scripts/build-windows.ps1 } finally { Stop-Transcript }
      - name: Test real offline vision-language AI and nonidentical object instances
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-neural-smoke
          ATLAS_NEURAL_FIXTURE: ${{ runner.temp }}/coco-two-cats.jpg
        run: |
          try { Invoke-WebRequest 'https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/coco_sample.png' -OutFile $env:ATLAS_NEURAL_FIXTURE }
          catch {
            try { Invoke-WebRequest 'https://images.cocodataset.org/val2017/000000039769.jpg' -OutFile $env:ATLAS_NEURAL_FIXTURE }
            catch { Write-Host "::error title=Neural fixture download::$($_.Exception.Message)"; throw }
          }
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--neural-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(1200000)) { $ApplicationProcess.Kill(); throw 'Real multimodal inference check timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Real multimodal inference or nonidentical instance detection failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/neural-smoke.json"
      - name: Test actual image decoders and ECW v2/v3 in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-formats-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--formats-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'Image format smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged image decoder smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/formats-smoke.json"
      - name: Test large ECW directories in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-ecw-index-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--ecw-index-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'ECW index smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Disk-backed ECW smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/ecw-index-smoke.json"
      - name: Test screenshot similarity with actual bundled AI
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-similar-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--similarity-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(600000)) { $ApplicationProcess.Kill(); throw 'Similarity smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Actual screenshot similarity smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/similarity-smoke.json"
      - name: Test aerial learning, masks, geometry, index and accelerated graph
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-precision-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--precision-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(900000)) { $ApplicationProcess.Kill(); throw 'Precision tools smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Actual precision tools smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/precision-smoke.json"
      - name: Test real BigTIFF tile addressing beyond one TiB in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-large-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--large-files-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'Large-file smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged large-file smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/large-files-smoke.json"
      - name: Smoke test packaged Windows application
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(90000)) { $ApplicationProcess.Kill(); throw 'Desktop smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged desktop smoke failed.' }
      - name: Test bundled AI, learning and search with external sockets blocked
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-ai-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--ai-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(900000)) { $ApplicationProcess.Kill(); throw 'AI smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged real AI smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/ai-smoke.json"
      - name: Verify actual offline installer, all archive parts and ZIP CRCs
        shell: pwsh
        run: |
          $InstallerProcess = Start-Process -FilePath './dist/AtlasScout-Setup.exe' -ArgumentList '--verify-package' -PassThru
          if (-not $InstallerProcess.WaitForExit(600000)) { $InstallerProcess.Kill(); throw 'Offline installer verification timed out.' }
          if ($InstallerProcess.ExitCode -ne 0) { throw 'Offline installer integrity or native GUI verification failed.' }
          Get-Content 'dist/installer-smoke.json'
      - name: Verify bounded package assets
        shell: pwsh
        run: |
          Get-ChildItem dist/AtlasScout-Windows.part* | ForEach-Object { if ($_.Length -ge 2GB) { throw 'Archive part exceeds GitHub asset limit.' } }
          if (-not (Test-Path dist/AtlasScout-Setup.exe)) { throw 'Offline installer is missing.' }
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasScout-Offline-Windows-x64
          path: |
            dist/AtlasScout-Setup.exe
            dist/AtlasScout-Windows.part*
            dist/AtlasScout-Package.json
            dist/AI-MODELS.json
            dist/installer-smoke.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Build diagnostics
        if: always()
        shell: pwsh
        run: |
          if ('${{ job.status }}' -eq 'failure' -and (Test-Path build.log)) {
            $TailText = (Get-Content build.log -Tail 35) -join '%0A'
            Write-Host "::error title=Windows build diagnostics::$TailText"
          }
          $DesktopReport = "$env:RUNNER_TEMP/atlas-smoke/desktop-smoke.json"
          if (Test-Path $DesktopReport) {
            $DesktopText = Get-Content $DesktopReport -Raw
            "### Desktop document" >> $env:GITHUB_STEP_SUMMARY
            $DesktopText >> $env:GITHUB_STEP_SUMMARY
            if ('${{ job.status }}' -eq 'failure') {
              $Escaped = $DesktopText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Desktop document::$Escaped"
            }
          }
          if (Test-Path build.log) {
            '### Build output' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build.log -Tail 120 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          foreach ($BuildLog in @('raster-build.log', 'model-build.log', 'enhanced-build.log', 'assistant-build.log', 'neural-build.log')) {
            if (Test-Path $BuildLog) {
              if ('${{ job.status }}' -eq 'failure') {
                $TailText = (Get-Content $BuildLog -Tail 45) -join '%0A'
                Write-Host "::error title=${BuildLog}::$TailText"
              }
              "### $BuildLog" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content $BuildLog -Tail 100 >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
          foreach ($LogPath in @("$env:RUNNER_TEMP/atlas-neural-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-neural-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-neural-smoke/assistant-runtime.log", "$env:RUNNER_TEMP/atlas-precision-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-precision-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-formats-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-formats-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-ecw-index-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-similar-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-similar-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-large-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-large-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-ai-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-ai-smoke/atlas.log")) {
            if (Test-Path $LogPath) {
              if ('${{ job.status }}' -eq 'failure') {
                $TailText = (Get-Content $LogPath -Tail 35) -join '%0A'
                Write-Host "::error title=$([IO.Path]::GetFileName($LogPath))::$TailText"
              }
              "### $([IO.Path]::GetFileName($LogPath))" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content $LogPath -Tail 100 >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-diagnostics
          path: |
            build.log
            raster-build.log
            model-build.log
            enhanced-build.log
            assistant-build.log
            neural-build.log
            ${{ runner.temp }}/atlas-neural-smoke/*.log
            pytest.log
            pytest-results.xml
            ${{ runner.temp }}/atlas-formats-smoke/*.log
            ${{ runner.temp }}/atlas-ecw-index-smoke/*.log
            ${{ runner.temp }}/atlas-similar-smoke/*.log
            ${{ runner.temp }}/atlas-precision-smoke/*.log
            ${{ runner.temp }}/atlas-large-smoke/*.log
            ${{ runner.temp }}/atlas-smoke/*.log
            ${{ runner.temp }}/atlas-smoke/desktop-smoke.json
            ${{ runner.temp }}/atlas-ai-smoke/*.log
      - name: Save verified offline build inputs
        if: ${{ always() && !cancelled() && steps.offline-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .model-cache
            .raster-cache
            .assistant-cache
          key: ${{ steps.offline-cache.outputs.cache-primary-key }}
  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/atlas-scout-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AtlasScout-Offline-Windows-x64
          path: package
      - name: Publish tested portable Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RELEASE_TAG: atlas-v0.8.0-offline.${{ github.run_number }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Offline Windows x64 preview with a real local Qwen2-VL vision-language assistant and native OWLv2 image/text-guided instance detection. Free Persian/English instructions, one or more optional reference images, editable descriptions, deletable/restorable training targets and editable/deletable chat messages. The new instance search does not require template correlation or matching pixel layout. The previous exact matching mode remains available.

          Download AtlasScout-Setup.exe and ALL AtlasScout-Windows.part files into the same folder. Run the setup EXE and choose a new destination folder. Setup verifies each part and the full ZIP64 checksum before extraction. No internet, Python or Node.js is required on the destination machine. Keep the whole installed folder. Existing training data is stored separately and preserved.

          Seven neural models, the existing DINO ONNX graph and a pinned MIT llama.cpp local runtime are included with licenses and source metadata. The language model runs on CPU and is unloaded before scene detection. OWLv2 runs on CPU in this portable build; existing DINO DirectML and WebGL rendering are retained. Query-independent scene embedding caching accelerates repeated searches; no numerical GPU or speed claim is made without a hardware benchmark. More scales inspect every selected tile, at additional processing cost.

          Native checks run the real VLM and detect two nonidentical objects in the official COCO example, in addition to previous actual-model, desktop, raster, ECW and sparse BigTIFF checks. This functional fixture does not establish satellite detection accuracy. Arbitrary requests are accepted by the language model; visible evidence, image resolution and detector capabilities still limit results. Model scores are not calibrated probabilities. Original pixel coordinates are exported; geographic export is not supported. No proprietary ECW SDK is included.
          NOTES
          gh release create "$RELEASE_TAG" package/AtlasScout-Setup.exe package/AtlasScout-Windows.part* package/AtlasScout-Package.json package/AI-MODELS.json package/installer-smoke.json package/SHA256SUMS.txt --repo "$REPOSITORY" --target "$COMMIT" --prerelease --title 'Atlas Scout 0.8.0 Offline — Local vision-language AI and instance detection' --notes-file release-notes.md
