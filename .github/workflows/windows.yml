name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main, atlas-scout-preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: atlas-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Restore verified offline build inputs
        id: offline-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .model-cache
            .raster-cache
          key: atlas-offline-inputs-${{ hashFiles('src/atlas/config.py', 'scripts/bundle-models.py', 'scripts/bundle-enhanced-models.py', 'requirements-lock.txt') }}
          restore-keys: atlas-offline-inputs-
      - name: Prepare the pinned Rust toolchain for the vendored MIT decoder
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install, test, and package
        shell: pwsh
        run: |
          Start-Transcript -Path build.log
          try { ./scripts/build-windows.ps1 } finally { Stop-Transcript }
      - name: Test actual image decoders and ECW v2/v3 in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-formats-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--formats-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'Image format smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged image decoder smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/formats-smoke.json"
      - name: Test large ECW directories in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-ecw-index-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--ecw-index-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'ECW index smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Disk-backed ECW smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/ecw-index-smoke.json"
      - name: Test screenshot similarity with actual bundled AI
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-similar-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--similarity-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(600000)) { $ApplicationProcess.Kill(); throw 'Similarity smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Actual screenshot similarity smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/similarity-smoke.json"
      - name: Test aerial learning, masks, geometry, index and accelerated graph
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-precision-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--precision-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(900000)) { $ApplicationProcess.Kill(); throw 'Precision tools smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Actual precision tools smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/precision-smoke.json"
      - name: Test real BigTIFF tile addressing beyond one TiB in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-large-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--large-files-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'Large-file smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged large-file smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/large-files-smoke.json"
      - name: Smoke test packaged Windows application
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(90000)) { $ApplicationProcess.Kill(); throw 'Desktop smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged desktop smoke failed.' }
      - name: Test bundled AI, learning and search with external sockets blocked
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-ai-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--ai-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(900000)) { $ApplicationProcess.Kill(); throw 'AI smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged real AI smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/ai-smoke.json"
      - name: Check package and write checksum
        shell: pwsh
        run: |
          if ((Get-Item 'dist/AtlasScout-Offline-Windows-x64.zip').Length -ge 2GB) { throw 'Package exceeds the GitHub release asset limit.' }
          $PackageHash = (Get-FileHash 'dist/AtlasScout-Offline-Windows-x64.zip' -Algorithm SHA256).Hash.ToLower()
          "$PackageHash  AtlasScout-Offline-Windows-x64.zip" | Set-Content 'dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasScout-Offline-Windows-x64
          path: |
            dist/AtlasScout-Offline-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Build diagnostics
        if: always()
        shell: pwsh
        run: |
          if ('${{ job.status }}' -eq 'failure' -and (Test-Path build.log)) {
            $TailText = (Get-Content build.log -Tail 35) -join '%0A'
            Write-Host "::error title=Windows build diagnostics::$TailText"
          }
          $DesktopReport = "$env:RUNNER_TEMP/atlas-smoke/desktop-smoke.json"
          if (Test-Path $DesktopReport) {
            $DesktopText = Get-Content $DesktopReport -Raw
            "### Desktop document" >> $env:GITHUB_STEP_SUMMARY
            $DesktopText >> $env:GITHUB_STEP_SUMMARY
            if ('${{ job.status }}' -eq 'failure') {
              $Escaped = $DesktopText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Desktop document::$Escaped"
            }
          }
          if (Test-Path build.log) {
            '### Build output' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build.log -Tail 120 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          foreach ($BuildLog in @('raster-build.log', 'model-build.log', 'enhanced-build.log')) {
            if (Test-Path $BuildLog) {
              if ('${{ job.status }}' -eq 'failure') {
                $TailText = (Get-Content $BuildLog -Tail 45) -join '%0A'
                Write-Host "::error title=${BuildLog}::$TailText"
              }
              "### $BuildLog" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content $BuildLog -Tail 100 >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
          foreach ($LogPath in @("$env:RUNNER_TEMP/atlas-precision-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-precision-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-formats-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-formats-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-ecw-index-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-similar-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-similar-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-large-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-large-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-ai-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-ai-smoke/atlas.log")) {
            if (Test-Path $LogPath) {
              if ('${{ job.status }}' -eq 'failure') {
                $TailText = (Get-Content $LogPath -Tail 35) -join '%0A'
                Write-Host "::error title=$([IO.Path]::GetFileName($LogPath))::$TailText"
              }
              "### $([IO.Path]::GetFileName($LogPath))" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content $LogPath -Tail 100 >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-diagnostics
          path: |
            build.log
            raster-build.log
            model-build.log
            enhanced-build.log
            pytest.log
            pytest-results.xml
            ${{ runner.temp }}/atlas-formats-smoke/*.log
            ${{ runner.temp }}/atlas-ecw-index-smoke/*.log
            ${{ runner.temp }}/atlas-similar-smoke/*.log
            ${{ runner.temp }}/atlas-precision-smoke/*.log
            ${{ runner.temp }}/atlas-large-smoke/*.log
            ${{ runner.temp }}/atlas-smoke/*.log
            ${{ runner.temp }}/atlas-smoke/desktop-smoke.json
            ${{ runner.temp }}/atlas-ai-smoke/*.log
      - name: Save verified offline build inputs
        if: ${{ always() && !cancelled() && steps.offline-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .model-cache
            .raster-cache
          key: ${{ steps.offline-cache.outputs.cache-primary-key }}
  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/atlas-scout-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AtlasScout-Offline-Windows-x64
          path: package
      - name: Publish tested portable Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RELEASE_TAG: atlas-v0.7.0-offline.${{ github.run_number }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Fully offline Windows x64 preview. Extract the entire ZIP into a new folder and open AtlasScout.exe. No Python or Node.js installation is needed. Five pinned models and a DINOv2 ONNX graph are included. Keep the whole extracted folder and retain linked imagery at its original path.

          New precision tools: correct/wrong result feedback, positive/negative reference examples, optional local Logistic Regression adaptation over fixed DINOv2 and aerial RemoteCLIP features, separate training/test examples and evaluation without overlapping known scene crops or sibling augmentations. One positive photo still starts a search; a negative example is needed only for the optional dedicated classifier. The foundation networks are not fine-tuned. Precision/recall/F1 are reported only with both test classes; these user-example metrics are not a satellite benchmark or calibrated probabilities. Grayscale matching continues to exclude colour-palette evidence.

          Target isolation accepts foreground/background clicks, a box with offline SAM2.1 Hiera Tiny, or a manual polygon. Review the proposed mask before applying; original references remain available. SIFT/RANSAC provides continuous rotation, scale and projective verification with inlier counts and polygon overlays. Verification is optional because low-detail targets may lack enough keypoints; strict mode excludes unverified candidates.

          Persistent disk-bounded dense-feature caching and a resumable scene index support repeated searches. Complete search checks every selected tile. Fast search retrieves a bounded set of indexed regions and explicitly reports approximate coverage, which can miss targets. CSV exports include evidence, geometry, target-model scores and search coverage. Search checkpoints and existing training data are preserved.

          A viewport-sized WebGL renderer draws only visible image tiles, with a bounded texture cache and fallback after context loss. Hardware settings offer auto/CPU/GPU and maximum/balanced performance. The portable Windows build includes DirectML for DINOv2 on compatible AMD/Intel/NVIDIA drivers; remaining models use CPU. Source installations with CUDA-enabled PyTorch can use CUDA. Auto mode falls back to CPU when a GPU fails. The active provider is reported only after execution, and DirectML node use is checked on the first inference. No specific GPU speedup is claimed without a hardware benchmark.

          Native Windows executable checks exercise actual bundled aerial/segmentation models, adaptation, held-out evaluation, feedback, index persistence, geometry, ONNX CPU parity, existing similarity search, raster formats, ECW v2/v3, a sparse BigTIFF with real tiles beyond one TiB, desktop startup and legacy learning with outbound Python sockets blocked. Controlled functional fixtures do not measure real-world satellite detection accuracy, a physical one-terabyte dataset, or GPU throughput. Image coordinates remain in original pixels; geographic export is not supported. Open-source model/codec license notices are included; no proprietary ECW SDK is bundled.
          NOTES
          gh release create "$RELEASE_TAG" package/AtlasScout-Offline-Windows-x64.zip package/SHA256SUMS.txt --repo "$REPOSITORY" --target "$COMMIT" --prerelease --title 'Atlas Scout 0.7.0 Offline — Precision teaching and local hardware rendering' --notes-file release-notes.md
