name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main, atlas-scout-preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: atlas-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Prepare the pinned Rust toolchain for the vendored MIT decoder
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install, test, and package
        shell: pwsh
        run: |
          Start-Transcript -Path build.log
          try { ./scripts/build-windows.ps1 } finally { Stop-Transcript }
      - name: Test actual image decoders and ECW v2/v3 in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-formats-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--formats-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'Image format smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged image decoder smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/formats-smoke.json"
      - name: Test large ECW directories in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-ecw-index-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--ecw-index-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'ECW index smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Disk-backed ECW smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/ecw-index-smoke.json"
      - name: Test screenshot similarity with actual bundled AI
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-similar-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--similarity-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(600000)) { $ApplicationProcess.Kill(); throw 'Similarity smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Actual screenshot similarity smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/similarity-smoke.json"
      - name: Test real BigTIFF tile addressing beyond one TiB in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-large-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--large-files-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'Large-file smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged large-file smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/large-files-smoke.json"
      - name: Smoke test packaged Windows application
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(90000)) { $ApplicationProcess.Kill(); throw 'Desktop smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged desktop smoke failed.' }
      - name: Test bundled AI, learning and search with external sockets blocked
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-ai-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--ai-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(900000)) { $ApplicationProcess.Kill(); throw 'AI smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged real AI smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/ai-smoke.json"
      - name: Check package and write checksum
        shell: pwsh
        run: |
          if ((Get-Item 'dist/AtlasScout-Offline-Windows-x64.zip').Length -ge 2GB) { throw 'Package exceeds the GitHub release asset limit.' }
          $PackageHash = (Get-FileHash 'dist/AtlasScout-Offline-Windows-x64.zip' -Algorithm SHA256).Hash.ToLower()
          "$PackageHash  AtlasScout-Offline-Windows-x64.zip" | Set-Content 'dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasScout-Offline-Windows-x64
          path: |
            dist/AtlasScout-Offline-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Build diagnostics
        if: always()
        shell: pwsh
        run: |
          if ('${{ job.status }}' -eq 'failure' -and (Test-Path build.log)) {
            $TailText = (Get-Content build.log -Tail 35) -join '%0A'
            Write-Host "::error title=Windows build diagnostics::$TailText"
          }
          if (Test-Path build.log) {
            '### Build output' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build.log -Tail 120 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          foreach ($LogPath in @("$env:RUNNER_TEMP/atlas-formats-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-formats-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-ecw-index-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-similar-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-similar-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-large-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-large-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-ai-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-ai-smoke/atlas.log")) {
            if (Test-Path $LogPath) {
              if ('${{ job.status }}' -eq 'failure') {
                $TailText = (Get-Content $LogPath -Tail 35) -join '%0A'
                Write-Host "::error title=$([IO.Path]::GetFileName($LogPath))::$TailText"
              }
              "### $([IO.Path]::GetFileName($LogPath))" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content $LogPath -Tail 100 >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-diagnostics
          path: |
            build.log
            pytest.log
            pytest-results.xml
            ${{ runner.temp }}/atlas-formats-smoke/*.log
            ${{ runner.temp }}/atlas-ecw-index-smoke/*.log
            ${{ runner.temp }}/atlas-similar-smoke/*.log
            ${{ runner.temp }}/atlas-large-smoke/*.log
            ${{ runner.temp }}/atlas-smoke/*.log
            ${{ runner.temp }}/atlas-ai-smoke/*.log
  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/atlas-scout-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AtlasScout-Offline-Windows-x64
          path: package
      - name: Publish tested portable Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RELEASE_TAG: atlas-v0.5.0-offline.${{ github.run_number }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Fully offline Windows x64 preview. Extract the entire ZIP into a new folder and open AtlasScout.exe. Python and Node.js installation is not required. Three pinned AI models (DINOv2 detail features, CLIP image and multilingual text) are included; first launch also works without Internet.

          Screenshot search now generates DINOv2 dense feature proposals independently of pixel-template matches, compares 3x3 spatial layout, and reranks exact crops with local DINOv2 and CLIP. Gradient matching also handles colour/exposure changes. Scale variation and 45-degree rotations remain available. CPU deep search takes longer. The default acceptance score is 55%; increasing it hides weaker matches without rescanning completed tiles.

          Results are ranked and graded: high similarity (85%+), similar (70–85%), and review (below 70%). Map boxes and cards show percentage scores and matching colours. Level filters update both map and paged results; selected crops can be compared beside the reference with component scores. CSV includes all accepted results, percentages, grades and component scores. Annotated PNG uses the same colours and percentage labels. Scores are heuristic similarity indices, not calibrated detection probabilities. Independent satellite detection accuracy has not been measured.

          The former ECW directory RAM gate is replaced by lazy raw/v3 directory access and bounded streaming decompression of v1/v2 compressed directories to an atomic reusable disk cache. The included MIT ecw2tiff fork retains upstream source/license/provenance; no proprietary ECW SDK is included. The first open of a compressed directory can require additional disk space and time. It does not copy the imagery. Synthetic large-directory ECWs exceed the old admission gate and test decoding and cache reuse; real ECW v2/v3 imagery is tested separately. A physical 1 TiB imagery dataset has not been benchmarked.

          Native executable checks passed for image formats, large ECW indexes, a sparse BigTIFF with real tile data beyond 1 TiB, screenshot matching using actual offline models (including independently rendered changed-colour/texture/geometry targets, ranking, grades and feature-only proposals), native desktop/channel startup and the existing real-AI training/search/feedback workflow. These controlled functional fixtures are not a satellite accuracy benchmark. Searches checkpoint each tile and resume; all accepted results are stored. Images and processing stay on this computer. Original pixel coordinates are retained; geographic coordinate export is not supported. Annotated PNG is a bounded overview. Retain linked originals at their selected path. Existing reference and training data are preserved. Previous version candidate caches are invalidated automatically. DINOv2 model attribution and its Apache 2.0 license are included.
          NOTES
          gh release create "$RELEASE_TAG" package/AtlasScout-Offline-Windows-x64.zip package/SHA256SUMS.txt --repo "$REPOSITORY" --target "$COMMIT" --prerelease --title 'Atlas Scout 0.5.0 Offline — Deep visual search and ranked similarity levels' --notes-file release-notes.md
