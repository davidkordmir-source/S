name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main, atlas-scout-preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: atlas-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install, test, and package
        shell: pwsh
        run: |
          Start-Transcript -Path build.log
          try { ./scripts/build-windows.ps1 } finally { Stop-Transcript }
      - name: Test actual image decoders and ECW v2/v3 in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-formats-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--formats-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'Image format smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged image decoder smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/formats-smoke.json"
      - name: Test real BigTIFF tile addressing beyond one TiB in the executable
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-large-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--large-files-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(180000)) { $ApplicationProcess.Kill(); throw 'Large-file smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged large-file smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/large-files-smoke.json"
      - name: Smoke test packaged Windows application
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(90000)) { $ApplicationProcess.Kill(); throw 'Desktop smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged desktop smoke failed.' }
      - name: Test bundled AI, learning and search with external sockets blocked
        shell: pwsh
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-ai-smoke
        run: |
          $ApplicationProcess = Start-Process -FilePath './dist/AtlasScout/AtlasScout.exe' -ArgumentList '--ai-smoke-test' -PassThru
          if (-not $ApplicationProcess.WaitForExit(900000)) { $ApplicationProcess.Kill(); throw 'AI smoke timed out.' }
          if ($ApplicationProcess.ExitCode -ne 0) { throw 'Packaged real AI smoke failed.' }
          Get-Content "$env:ATLAS_DATA_DIR/ai-smoke.json"
      - name: Check package and write checksum
        shell: pwsh
        run: |
          if ((Get-Item 'dist/AtlasScout-Offline-Windows-x64.zip').Length -ge 2GB) { throw 'Package exceeds the GitHub release asset limit.' }
          $PackageHash = (Get-FileHash 'dist/AtlasScout-Offline-Windows-x64.zip' -Algorithm SHA256).Hash.ToLower()
          "$PackageHash  AtlasScout-Offline-Windows-x64.zip" | Set-Content 'dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasScout-Offline-Windows-x64
          path: |
            dist/AtlasScout-Offline-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Build diagnostics
        if: always()
        shell: pwsh
        run: |
          if ('${{ job.status }}' -eq 'failure' -and (Test-Path build.log)) {
            $TailText = (Get-Content build.log -Tail 35) -join '%0A'
            Write-Host "::error title=Windows build diagnostics::$TailText"
          }
          if (Test-Path build.log) {
            '### Build output' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build.log -Tail 120 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          foreach ($LogPath in @("$env:RUNNER_TEMP/atlas-formats-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-formats-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-large-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-large-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-smoke/atlas.log", "$env:RUNNER_TEMP/atlas-ai-smoke/startup-error.log", "$env:RUNNER_TEMP/atlas-ai-smoke/atlas.log")) {
            if (Test-Path $LogPath) {
              if ('${{ job.status }}' -eq 'failure') {
                $TailText = (Get-Content $LogPath -Tail 35) -join '%0A'
                Write-Host "::error title=$([IO.Path]::GetFileName($LogPath))::$TailText"
              }
              "### $([IO.Path]::GetFileName($LogPath))" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content $LogPath -Tail 100 >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-diagnostics
          path: |
            build.log
            pytest.log
            pytest-results.xml
            ${{ runner.temp }}/atlas-formats-smoke/*.log
            ${{ runner.temp }}/atlas-large-smoke/*.log
            ${{ runner.temp }}/atlas-smoke/*.log
            ${{ runner.temp }}/atlas-ai-smoke/*.log
  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/atlas-scout-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AtlasScout-Offline-Windows-x64
          path: package
      - name: Publish tested portable Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RELEASE_TAG: atlas-v0.3.0-offline.${{ github.run_number }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Fully offline Windows x64 preview. Extract the entire ZIP and open AtlasScout.exe. Python and Node.js installation is not required. Both pinned AI models are included; first launch also works without Internet.

          Import your satellite image, draw positive and negative examples, train a local classifier and find similar regions in that image. Save/import training packs, refine with feedback, and export annotated PNG or pixel-coordinate CSV. Persian/English text search is also local.

          The executable passed real image-decoder and ECW v2/v3 checks, a native desktop check and actual bundled-model training, held-out image search, feedback/retraining, training-pack roundtrip and Persian/English inference with external socket connections blocked. This functional check uses controlled fixtures; satellite detection accuracy has not been benchmarked. Scores are not calibrated probabilities. Scenes open directly from disk with no fixed file-byte limit. Previews, visible tiles, training crops and search windows are read on demand. The executable also passed a sparse BigTIFF test with a genuine encoded tile beyond 1 TiB, a 720-million-pixel raster, bounded memory growth, original pixel coordinates, and training/export persistence. This is not a physical 1 TiB imagery or universal-codec performance test. A real streamed 160 MiB upload passed regression tests. Huge files need a window-capable codec and appropriate internal blocks; ECW index memory is bounded and oversized indexes are reported explicitly. Select a search region for large scenes (5000 windows per search). Annotated PNG exports are overviews up to 4096 pixels; CSV keeps original pixel coordinates. File linking is the default on Windows; keep linked originals at the selected path. ECW v2/v3, GeoTIFF, JPEG 2000, HEIC/HEIF, AVIF, GIF and other readers are bundled. Previous format coverage: ECW v2/v3, GeoTIFF, JPEG 2000, HEIC/HEIF, AVIF, GIF and many other image formats have bundled offline readers. Multi-page/animated inputs use the first frame; high-bit/multiband rasters are converted to RGB8 for search. Geographic coordinate export is not supported.
          NOTES
          gh release create "$RELEASE_TAG" package/AtlasScout-Offline-Windows-x64.zip package/SHA256SUMS.txt --repo "$REPOSITORY" --target "$COMMIT" --prerelease --title 'Atlas Scout 0.3.0 Offline — Windows, large image files' --notes-file release-notes.md
