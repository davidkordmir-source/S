[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-scout"
version = "0.3.0"
description = "Windows desktop building search with local image and Persian text embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<0.29",
  "pillow>=11,<14", "pillow-heif>=1.8,<2", "ecw2tiff==0.1.1", "rasterio==1.5.2", "numpy>=2,<3", "pyproj>=3.7,<4",
  "defusedxml>=0.7,<1", "PySide6>=6.8,<7",
  "scikit-learn>=1.6,<2", "scipy>=1.15,<2",
]

[project.optional-dependencies]
ai = ["sentence-transformers>=5.1,<6", "torch>=2.6,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pyinstaller>=6.12,<7", "ruff>=0.11,<1"]

[project.scripts]
atlas-scout = "atlas.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
